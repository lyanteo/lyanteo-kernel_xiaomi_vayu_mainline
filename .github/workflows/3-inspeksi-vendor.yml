name: 3 - Inspeksi vendor ROM untuk kernel mainline

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "URL zip ROM"
        default: "https://downloads.sourceforge.net/project/infinity-x/vayu/16/gapps/Project_Infinity-X-3.12-vayu-20.09.2026-GAPPS-OFFICIAL.zip"

env:
  ROM_URL: ${{ inputs.rom_url || 'https://downloads.sourceforge.net/project/infinity-x/vayu/16/gapps/Project_Infinity-X-3.12-vayu-20.09.2026-GAPPS-OFFICIAL.zip' }}

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Kosongkan disk + alat
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update && sudo apt-get install -y erofs-utils e2fsprogs android-sdk-libsparse-utils brotli unzip file p7zip-full lz4
          curl -fsSL -o /tmp/pd.tgz https://github.com/ssut/payload-dumper-go/releases/download/1.3.0/payload-dumper-go_1.3.0_linux_amd64.tar.gz && sudo tar xzf /tmp/pd.tgz -C /usr/local/bin payload-dumper-go && payload-dumper-go --help | head -1 || true
          df -h /

      - name: Download ROM
        run: |
          mkdir -p rom && cd rom
          curl -fL --retry 3 -o rom.zip "$ROM_URL"
          ls -lh rom.zip; file rom.zip
          unzip -l rom.zip | tee ../zip-list.txt

      - name: Ekstrak boot, dtbo, vendor
        working-directory: rom
        run: |
          mkdir -p img
          if unzip -l rom.zip | grep -q payload.bin; then
            unzip -o rom.zip payload.bin && rm rom.zip
            payload-dumper-go -l payload.bin | tee ../partitions.txt
            payload-dumper-go -p boot,dtbo,vendor,vendor_boot,vbmeta -o img payload.bin || payload-dumper-go -p boot,dtbo,vendor -o img payload.bin
            rm payload.bin
          else
            unzip -o rom.zip 'boot.img' 'dtbo.img' 'vendor.*' -d img || true
            cd img
            [ -f vendor.new.dat.br ] && brotli -d vendor.new.dat.br && python3 - <<'EOF'
          import re
          # sdat2img sederhana
          tl=open('vendor.transfer.list').read().split('\n')
          v=int(tl[0]); nb=int(tl[1])
          out=open('vendor.img','wb'); data=open('vendor.new.dat','rb')
          for l in tl[2:]:
              p=l.split(' ')
              if p[0]=='new':
                  r=list(map(int,p[1].split(',')))[1:]
                  for a,b in zip(r[0::2],r[1::2]):
                      out.seek(a*4096); out.write(data.read((b-a)*4096))
          out.close()
          EOF
          fi
          cd "$GITHUB_WORKSPACE/rom" && ls -lh img

      - name: Info kernel bawaan ROM
        working-directory: rom/img
        run: |
          {
          echo "== boot.img =="; file boot.img
          python3 - <<'EOF'
          import struct
          d=open('boot.img','rb').read()
          ks=struct.unpack_from('<I',d,8)[0]; ps=struct.unpack_from('<I',d,36)[0]
          open('kernel.bin','wb').write(d[ps:ps+ks])
          print("kernel size",ks,"page",ps)
          EOF
          file kernel.bin
          ( lz4 -dc kernel.bin 2>/dev/null || gzip -dc kernel.bin 2>/dev/null || cat kernel.bin ) | strings | grep -m1 "Linux version"
          strings boot.img | grep -m1 -oE "androidboot[^\"]{0,300}" || true
          } | tee ../../kernel-info.txt || true

      - name: Bongkar vendor
        working-directory: rom/img
        run: |
          f=vendor.img
          file $f
          if file $f | grep -q "sparse"; then simg2img $f v.raw && mv v.raw $f; fi
          mkdir -p ../vendor
          if fsck.erofs $f >/dev/null 2>&1; then sudo fsck.erofs --extract=../vendor $f; else sudo debugfs -R "rdump / ../vendor" $f; fi
          sudo chmod -R a+rX ../vendor; du -sh ../vendor

      - name: Laporan
        working-directory: rom/vendor
        run: |
          set +e
          R=../../laporan-vendor.txt
          {
          echo "##### build.prop"; grep -hE "ro.vendor.build.(fingerprint|version.release|version.sdk)|ro.board.platform|ro.product.vendor.device|ro.vendor.build.security_patch" build.prop etc/build.prop 2>/dev/null
          echo; echo "##### Blob GPU/grafis Qualcomm (pakai kgsl)"; find . -iname '*adreno*' -o -iname '*gralloc*' -o -iname '*hwcomposer*' -o -iname 'libsdm*' -o -iname '*kgsl*' | sort
          echo; echo "##### Blob kamera"; find . -ipath '*camera*' -name '*.so' | wc -l
          echo; echo "##### Blob RIL/modem"; find . -iname '*ril*' -o -iname '*qmi*' -o -iname '*netmgr*' | grep -v '\.xml$' | sort | head -40
          echo; echo "##### Blob audio"; find . -iname '*audio*.so' | wc -l
          echo; echo "##### HAL di VINTF manifest"; cat etc/vintf/manifest.xml etc/vintf/manifest/*.xml 2>/dev/null | grep -oE "<(name|fqname)>[^<]+" | sed 's/<[a-z]*>//' | sort -u
          echo; echo "##### Service init vendor"; cat etc/init/*.rc etc/init/hw/*.rc 2>/dev/null | grep -E "^service " | awk '{print $2"  "$3}' | sort -u
          echo; echo "##### Modul kernel di vendor"; find . -name '*.ko' | sort
          echo; echo "##### fstab"; cat etc/fstab.* 2>/dev/null | grep -v '^#'
          } > $R 2>&1
          cat $R

      - uses: actions/upload-artifact@v4
        with:
          name: laporan-vendor-infinityx
          path: |
            laporan-vendor.txt
            kernel-info.txt
            partitions.txt
            zip-list.txt
