name: 1 - Kernel mainline 7.x + Android untuk vayu

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Repo kernel SM8150 mainline (punya DTS vayu)"
        default: "https://gitlab.nura.eco/soc/qualcomm-sm8150/linux.git"
      kernel_ref:
        description: "Branch/tag (kosong = tag *-sm8150 terbaru)"
        default: ""
  push:
    paths: ["kernel/**", ".github/workflows/1-kernel.yml"]

env:
  ARCH: arm64
  LLVM: "1"
  RUST_LIB_SRC: /usr/lib/rust-1.85/lib/rustlib/src/rust/library
  FALLBACK_REPO: https://gitlab.com/sm8150-mainline/linux.git

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (clang 18 + Rust 1.85 + bindgen 0.71.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 libclang-18-dev \
            rustc-1.85 rust-1.85-src cargo-1.85 flex bison bc libssl-dev libelf-dev cpio kmod
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
          echo "/usr/lib/rust-1.85/bin" >> $GITHUB_PATH
          echo "$HOME/tools/bin" >> $GITHUB_PATH
          PATH=/usr/lib/llvm-18/bin:$PATH cargo-1.85 install --locked bindgen-cli --version 0.71.1 --root $HOME/tools

      - name: Ambil source kernel
        run: |
          REPO="${{ inputs.kernel_repo }}"; REPO="${REPO:-https://gitlab.nura.eco/soc/qualcomm-sm8150/linux.git}"
          REF="${{ inputs.kernel_ref }}"
          if ! git ls-remote "$REPO" >/dev/null 2>&1; then echo "Repo $REPO tidak bisa diakses, pakai $FALLBACK_REPO"; REPO=$FALLBACK_REPO; fi
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --tags --refs "$REPO" | awk -F/ '{print $NF}' | grep -E 'sm8150' | sort -V | tail -1)
          fi
          echo "Repo: $REPO  Ref: $REF"
          git clone --depth 1 --branch "$REF" "$REPO" linux
          head -4 linux/Makefile

      - name: Cari device tree vayu
        working-directory: linux
        run: |
          DTS=$(ls arch/arm64/boot/dts/qcom/ | grep -E 'vayu' || true)
          if [ -z "$DTS" ]; then
            echo "::error::DTS vayu tidak ada di ref ini. File sm8150 yang ada:"; ls arch/arm64/boot/dts/qcom/ | grep sm8150; exit 1
          fi
          echo "$DTS"

      - name: Config (arm64 defconfig + fragment sm8150 + fragment Android)
        working-directory: linux
        run: |
          make rustavailable
          make O=out defconfig
          EXTRA=$(ls arch/arm64/configs/*sm8150*.config 2>/dev/null || true)
          echo "Fragment SoC: ${EXTRA:-(tidak ada)}"
          if grep -q '^config ANDROID_BINDER_IPC$' drivers/android/Kconfig; then BINDER=../kernel/binder-c.config; else BINDER=../kernel/binder-rust.config; fi
          echo "Binder: $BINDER"
          ./scripts/kconfig/merge_config.sh -m -O out out/.config $EXTRA ../kernel/android.config $BINDER
          make O=out olddefconfig
          sh ../kernel/check-config.sh ../kernel/android.config out/.config
          sh ../kernel/check-config.sh $BINDER out/.config

      - name: Build
        working-directory: linux
        run: make O=out -j$(nproc) Image.gz dtbs modules

      - name: Kumpulkan hasil
        run: |
          mkdir -p dist/modules
          cp linux/out/arch/arm64/boot/Image.gz linux/out/.config dist/
          cp linux/out/arch/arm64/boot/dts/qcom/*vayu*.dtb dist/
          make -C linux O=out INSTALL_MOD_PATH=$PWD/dist/modules INSTALL_MOD_STRIP=1 modules_install
          tar -C dist -czf dist/modules.tar.gz modules && rm -rf dist/modules
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-vayu-mainline-android
          path: dist/*
