name: Build kernel 6.13 vayu

# sm8150-mainline v6.13 + patch vayu di patches/6.13/
# Hasil: DTB dan boot image header v2 (format sama dengan boot.img
# Infinity-X 3.12 vayu), plus uji jalan di QEMU.

on:
  push:
    branches: [main]
    paths: ["patches/**", "initramfs/**", "tools/**", "vayu.config", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ARCH: arm64
  LLVM: "1"
  KERNEL_REPO: https://gitlab.com/sm8150-mainline/linux.git
  KERNEL_TAG: v6.13.0-sm8150
  ROM_URL: https://downloads.sourceforge.net/project/infinity-x/vayu/16/gapps/Project_Infinity-X-3.12-vayu-20.09.2026-GAPPS-OFFICIAL.zip

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Alat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm flex bison bc libssl-dev libelf-dev cpio python3 file qemu-system-arm device-tree-compiler unzip
          git clone -q --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg /opt/mkbootimg
          DEB=$(curl -fsSL http://ports.ubuntu.com/pool/universe/b/busybox/ | grep -o 'busybox-static_[^"]*_arm64\.deb' | sort -uV | tail -n1)
          echo "busybox: $DEB"
          curl -fsSL -o busybox.deb "http://ports.ubuntu.com/pool/universe/b/busybox/$DEB"
          dpkg-deb -x busybox.deb bb
          # Ubuntu menamai binary-nya usr/bin/busybox-static
          BB=$(find bb -type f \( -name busybox -o -name busybox-static \) | head -n1)
          echo "BB=$BB" >> "$GITHUB_ENV"
          file "$BB"
          file "$BB" | grep -q "ARM aarch64"
          file "$BB" | grep -q "statically linked"

      - name: Source kernel + patch vayu
        run: |
          git clone -q --depth 1 --branch "$KERNEL_TAG" "$KERNEL_REPO" linux
          cd linux
          git -c user.name=ci -c user.email=ci@localhost am -q --whitespace=nowarn ../patches/6.13/*.patch
          git log --oneline -7
          cp ../vayu.config arch/arm64/configs/vayu.config

      - name: Config
        run: |
          cd linux
          make -s O=out defconfig sm8150.config vayu.config
          for o in DRM_PANEL_NOVATEK_NT36672C_J20S TOUCHSCREEN_NT36xxx_HOSTDL_SPI PSTORE_RAM PSTORE_CONSOLE \
                   DRM_MSM BACKLIGHT_QCOM_WLED FB_SIMPLE FRAMEBUFFER_CONSOLE USB_DWC3_QCOM USB_CONFIGFS_ACM \
                   USB_CONFIGFS_NCM BLK_DEV_INITRD RD_GZIP DEVTMPFS; do
            grep -q "^CONFIG_$o=y" out/.config || { echo "::error::CONFIG_$o tidak =y"; exit 1; }
          done
          echo "Semua opsi wajib aktif"

      - name: Build
        run: |
          cd linux
          make O=out -j"$(nproc)" DTC_FLAGS=-@ Image qcom/sm8150-xiaomi-vayu.dtb qcom/sm8150-xiaomi-vayu-tianma.dtb 2>&1 | tee ../build.log | grep -E "error|warning: .*(nt36672c|xiaomi|j20s)" || true
          test -f out/arch/arm64/boot/Image
          ls -l out/arch/arm64/boot/Image
          out/scripts/dtc/dtc -I dtb -O dts out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-vayu.dtb 2>/dev/null | grep -A2 "ramoops@a1600000"
          # __symbols__ wajib ada agar bootloader bisa menempelkan overlay dtbo
          out/scripts/dtc/dtc -I dtb -O dts out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-vayu.dtb 2>/dev/null | grep -q "__symbols__"

      - name: Simulasi bootloader - overlay dtbo Infinity-X (wajib lolos)
        run: |
          python3 tools/alihkan_symbols.py linux/out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-vayu.dtb \
            linux/out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-vayu-tianma.dtb
          curl -fL --retry 3 -o rom.zip "$ROM_URL"
          unzip -o rom.zip dtbo.img && rm rom.zip
          for v in vayu vayu-tianma; do
            python3 tools/cek_dtbo.py dtbo.img linux/out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-$v.dtb cek-$v --ketat
          done

      - name: Initramfs + boot image
        run: |
          mkdir -p rd/bin dist
          cp "$BB" rd/bin/busybox
          cp initramfs/init rd/init
          clang --target=aarch64-linux-gnu -static -nostdlib -ffreestanding -fno-stack-protector \
            -O2 -fuse-ld=lld -o rd/bin/reboot-recovery initramfs/reboot-recovery.c
          file rd/bin/reboot-recovery | grep -q "ARM aarch64"
          chmod 755 rd/init rd/bin/busybox rd/bin/reboot-recovery
          (cd rd && find . | cpio -o -H newc -R root:root --quiet | gzip -9) > initramfs.cpio.gz
          # Format disamakan dengan boot.img Infinity-X 3.12 vayu (dicek dari ROM):
          # header v2, page 4096, kernel Image TIDAK terkompresi di 0x8000,
          # ramdisk 0x1000000, tags 0x100, DTB terpisah di 0x1f00000,
          # os 16.0.0, patch 2026-09.
          for v in vayu vayu-tianma; do
            python3 /opt/mkbootimg/mkbootimg.py --header_version 2 --pagesize 4096 \
              --base 0x00000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 \
              --tags_offset 0x00000100 --dtb_offset 0x01f00000 \
              --os_version 16.0.0 --os_patch_level 2026-09 \
              --kernel linux/out/arch/arm64/boot/Image --ramdisk initramfs.cpio.gz \
              --dtb linux/out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-$v.dtb \
              --cmdline "console=tty0 loglevel=7 ignore_loglevel panic=10 clk_ignore_unused pd_ignore_unused" \
              -o dist/boot-6.13-$v.img
            python3 /opt/mkbootimg/unpack_bootimg.py --boot_img dist/boot-6.13-$v.img --out /tmp/chk-$v --format=info | head -20
          done
          cp linux/out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-vayu*.dtb dist/
          cp linux/out/.config dist/kernel.config
          cd dist && sha256sum * > SHA256SUMS && ls -lh

      - name: Uji jalan di QEMU (kernel + initramfs yang sama)
        run: |
          # Hardware vayu tidak bisa diemulasikan, tapi ini membuktikan kernel
          # tidak crash di kode umum dan init + busybox benar-benar jalan.
          timeout 180 qemu-system-aarch64 -M virt -cpu max -smp 2 -m 2048 -nographic -no-reboot \
            -kernel linux/out/arch/arm64/boot/Image -initrd initramfs.cpio.gz \
            -append "console=ttyAMA0 panic=-1" > qemu.log 2>&1 || true
          grep -E "Linux version|vayu-initramfs|Kernel panic|Unable to mount|not syncing" qemu.log | head -20
          grep -q "Kernel panic" qemu.log && { echo "::error::kernel panic di QEMU"; tail -40 qemu.log; exit 1; }
          grep -q "vayu-initramfs: ready" qemu.log || { echo "::error::init tidak sampai siap"; tail -60 qemu.log; exit 1; }
          grep -q "VAYU-TES: kernel" qemu.log || { echo "::error::ringkasan VAYU-TES tidak tercatat"; exit 1; }
          grep -E "VAYU-TES|reboot|Restarting" qemu.log | tail -25
          grep -q "Restarting system with command 'recovery'" qemu.log || { echo "::error::restart ke recovery tidak terjadi"; tail -40 qemu.log; exit 1; }
          echo "QEMU: kernel boot, init siap, ringkasan tercatat, restart ke recovery terjadi"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-6.13-vayu
          path: dist/
