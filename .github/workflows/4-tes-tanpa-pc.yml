name: 4 - Tes boot 6.4 tanpa PC (partisi recovery)

# Kernel sm8150-mainline 6.4 (yang dipakai postmarketOS untuk vayu)
# + ramoops sama dengan kernel vendor, supaya log bisa dibaca dari Infinity-X.
# Hasil diterbitkan sebagai Release agar mudah diunduh dari HP.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tanpa-pc/**", ".github/workflows/4-tes-tanpa-pc.yml"]

permissions:
  contents: write

env:
  ARCH: arm64
  LLVM: "1"
  KERNEL_REPO: https://gitlab.com/sm8150-mainline/linux.git
  KERNEL_BRANCH: sm8150/6.4
  # commit yang dipakai paket linux-postmarketos-qcom-sm8150 untuk vayu
  KERNEL_COMMIT: 93f303701cafa17135d8ee563ffdc39f319783f1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Alat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm flex bison bc libssl-dev libelf-dev cpio python3
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg /opt/mkbootimg
          # busybox statis arm64 dari Ubuntu ports
          DEB=$(curl -fsSL http://ports.ubuntu.com/pool/universe/b/busybox/ | grep -o 'busybox-static_[^"]*_arm64\.deb' | sort -uV | tail -n1)
          echo "busybox: $DEB"
          curl -fsSL -o busybox.deb "http://ports.ubuntu.com/pool/universe/b/busybox/$DEB"
          dpkg-deb -x busybox.deb bb
          file bb/bin/busybox | tee /dev/stderr | grep -q "ARM aarch64"
          file bb/bin/busybox | grep -q "statically linked"

      - name: Ambil source kernel 6.4
        run: |
          git init -q linux && cd linux
          git remote add origin "$KERNEL_REPO"
          git fetch -q --depth 1 origin "$KERNEL_COMMIT" || git fetch -q --depth 1 origin "$KERNEL_BRANCH"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %s'
          test -f arch/arm64/boot/dts/qcom/sm8150-xiaomi-vayu.dts

      - name: Tambah ramoops + config tes
        run: |
          python3 tanpa-pc/tambah-ramoops.py linux/arch/arm64/boot/dts/qcom/sm8150-xiaomi-vayu.dts
          cp tanpa-pc/vayu-test.config linux/arch/arm64/configs/vayu-test.config
          cd linux
          make -s O=out defconfig sm8150.config vayu-test.config
          for o in PSTORE_RAM PSTORE_CONSOLE DRM_SIMPLEDRM FRAMEBUFFER_CONSOLE BLK_DEV_INITRD RD_GZIP DEVTMPFS; do
            grep -q "^CONFIG_$o=y" out/.config || { echo "::error::CONFIG_$o tidak aktif"; exit 1; }
          done
          grep "^CONFIG_PANIC_TIMEOUT=10" out/.config

      - name: Build kernel + DTB
        run: |
          cd linux
          make O=out -j"$(nproc)" Image.gz qcom/sm8150-xiaomi-vayu.dtb
          out/scripts/dtc/dtc -I dtb -O dts out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-vayu.dtb 2>/dev/null | grep -A3 "ramoops@a1600000"

      - name: Initramfs (busybox saja, tanpa modul)
        run: |
          mkdir -p rd/bin
          cp bb/bin/busybox rd/bin/busybox
          cp tanpa-pc/init rd/init
          chmod 755 rd/init rd/bin/busybox
          (cd rd && find . | cpio -o -H newc -R root:root --quiet | gzip -9) > initramfs.cpio.gz
          ls -lh initramfs.cpio.gz

      - name: Rakit image (format sama dengan postmarketOS vayu)
        run: |
          mkdir -p dist
          cat linux/out/arch/arm64/boot/Image.gz linux/out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-vayu.dtb > Image.gz-dtb
          python3 /opt/mkbootimg/mkbootimg.py --header_version 0 --pagesize 4096 \
            --base 0x00000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 \
            --second_offset 0x00f00000 --tags_offset 0x00000100 \
            --kernel Image.gz-dtb --ramdisk initramfs.cpio.gz \
            --cmdline "console=tty0 loglevel=7 ignore_loglevel panic=10 clk_ignore_unused pd_ignore_unused" \
            -o dist/boot-6.4-vayu-recovery.img
          python3 /opt/mkbootimg/unpack_bootimg.py --boot_img dist/boot-6.4-vayu-recovery.img --out /tmp/chk --format=info | head -12
          cp tanpa-pc/tes.sh tanpa-pc/CARA-TES-TANPA-PC.txt dist/
          cd dist && sha256sum * > SHA256SUMS && ls -lh

      - name: Terbitkan Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tes-6.4-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Tes boot 6.4 tanpa PC #${GITHUB_RUN_NUMBER}" \
            --notes "Untuk partisi RECOVERY saja. Baca CARA-TES-TANPA-PC.txt. Jangan flash ke boot."
