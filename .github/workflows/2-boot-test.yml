name: 2 - Boot-test kernel mainline (fastboot boot)

on:
  workflow_run:
    workflows: ["1 - Kernel mainline 7.x + Android untuk vayu"]
    types: [completed]
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: "Run ID workflow 1 (kernel) yang artifact-nya dipakai"
        required: true

permissions:
  actions: read
  contents: read

env:
  KERNEL_RUN: ${{ inputs.kernel_run_id || github.event.workflow_run.id }}
  ROM_URL: https://downloads.sourceforge.net/project/infinity-x/vayu/16/gapps/Project_Infinity-X-3.12-vayu-20.09.2026-GAPPS-OFFICIAL.zip

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Alat
        run: |
          sudo apt-get update && sudo apt-get install -y cpio unzip file
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg /opt/mkbootimg
          printf '#!/bin/sh\nexec python3 /opt/mkbootimg/mkbootimg.py "$@"\n' | sudo tee /usr/local/bin/mkbootimg
          printf '#!/bin/sh\nexec python3 /opt/mkbootimg/unpack_bootimg.py "$@"\n' | sudo tee /usr/local/bin/unpack_bootimg
          sudo chmod +x /usr/local/bin/mkbootimg /usr/local/bin/unpack_bootimg
          mkbootimg --help | head -2

      - name: Ambil kernel 7.0 dari workflow 1
        uses: actions/download-artifact@v4
        with:
          name: kernel-vayu-mainline-android
          path: k
          run-id: ${{ env.KERNEL_RUN }}
          github-token: ${{ github.token }}

      - name: Ambil header boot.img Infinity-X (acuan format bootloader)
        run: |
          curl -fL --retry 3 -o rom.zip "$ROM_URL"
          unzip -o rom.zip boot.img && rm rom.zip
          unpack_bootimg --boot_img boot.img --out ref --format=info | tee ref-info.txt
          ls -la ref

      - name: Initramfs (Alpine aarch64 + modul kernel + init tahap 1)
        run: |
          mkdir -p rd && cd rd
          V=$(curl -fsL https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64/latest-releases.yaml | grep -m1 'file: alpine-minirootfs' | awk '{print $2}')
          echo "Alpine: $V"
          curl -fsL "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64/$V" | sudo tar xz
          # busybox-extras (telnetd, udhcpd)
          REPO=https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/aarch64
          curl -fsL $REPO/APKINDEX.tar.gz | tar xzO APKINDEX > /tmp/APKINDEX
          BXV=$(awk '/^P:busybox-extras$/{f=1} f&&/^V:/{print substr($0,3);exit}' /tmp/APKINDEX)
          echo "busybox-extras $BXV"
          curl -fsL "$REPO/busybox-extras-$BXV.apk" | sudo tar xz --warning=no-unknown-keyword 2>/dev/null || true
          ls -la bin/busybox-extras || exit 1
          for a in telnetd udhcpd; do sudo ln -sf /bin/busybox-extras usr/sbin/$a; done
          grep -E '^CONFIG_MODULE_COMPRESS' ../k/.config || true
          sudo tar xzf ../k/modules.tar.gz -C /tmp
          sudo mkdir -p lib/modules && sudo cp -a /tmp/modules/lib/modules/* lib/modules/
          KREL=$(ls lib/modules); echo "Modul untuk: $KREL"
          # Kurangi ukuran: buang modul yang jelas tidak relevan untuk vayu
          sudo find lib/modules -path '*drivers/gpu/drm/*' ! -path '*msm*' ! -path '*panel*' ! -path '*display*' ! -path '*bridge*' -name '*.ko*' -delete
          sudo find lib/modules -path '*drivers/net/wireless/*' ! -path '*ath*' -name '*.ko*' -delete
          sudo find lib/modules -path '*drivers/media/*' -name '*.ko*' -delete
          sudo find lib/modules -path '*sound/*' ! -path '*qcom*' ! -path '*soc/codecs*' -name '*.ko*' -delete
          sudo /sbin/depmod -b . "$KREL"
          sudo install -m755 ../stage1/init init
          printf 'start 172.16.42.2\nend 172.16.42.2\ninterface usb0\noption subnet 255.255.255.0\n' | sudo tee etc/udhcpd.conf
          sudo sh -c 'find . | cpio -o -H newc 2>/dev/null | gzip -9 > ../initramfs.cpio.gz'
          cd .. && ls -lh initramfs.cpio.gz

      - name: Rakit boot-test.img untuk tiap panel
        run: |
          get() { grep -m1 "^$1" ref-info.txt | sed "s/^$1[^:]*: *//"; }
          HV=$(get "boot image header version"); PS=$(get "page size")
          OSV=$(get "os version"); OSP=$(get "os patch level")
          echo "header=$HV page=$PS os=$OSV patch=$OSP"
          CMD="console=tty0 loglevel=7 rdinit=/init clk_ignore_unused pd_ignore_unused"
          mkdir -p out
          for P in tianma huaxing; do
            DTB=k/sm8150-xiaomi-vayu-$P.dtb
            if [ "$HV" -ge 2 ] 2>/dev/null; then
              mkbootimg --header_version "$HV" --pagesize "$PS" --base 0x0 --kernel_offset 0x8000 \
                --ramdisk_offset 0x1000000 --tags_offset 0x100 --dtb_offset 0x1f00000 \
                --os_version "$OSV" --os_patch_level "$OSP" \
                --kernel k/Image.gz --ramdisk initramfs.cpio.gz --dtb "$DTB" \
                --cmdline "$CMD" -o out/boot-test-$P.img
            else
              cat k/Image.gz "$DTB" > /tmp/Image.gz-dtb
              mkbootimg --header_version "${HV:-0}" --pagesize "$PS" --base 0x0 --kernel_offset 0x8000 \
                --ramdisk_offset 0x1000000 --tags_offset 0x100 \
                --os_version "$OSV" --os_patch_level "$OSP" \
                --kernel /tmp/Image.gz-dtb --ramdisk initramfs.cpio.gz \
                --cmdline "$CMD" -o out/boot-test-$P.img
            fi
            unpack_bootimg --boot_img out/boot-test-$P.img --out /tmp/chk-$P --format=info | head -12
          done
          cp stage1/CARA-TES.txt out/ 2>/dev/null || true
          cd out && sha256sum *.img > SHA256SUMS && ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: boot-test-kernel7-vayu
          path: out/*
